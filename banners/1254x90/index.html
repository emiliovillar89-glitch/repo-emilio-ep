<!doctype html>
<html lang="es-UY">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="ad.size" content="width=1254,height=90"><title>Gallito · 1254×90</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="banner" aria-label="Inmuebles El País">
  <div class="accent" aria-hidden="true"></div>
  <div class="brand"><img src="assets/logo.svg" alt="Inmuebles El País"></div>
  <section class="message"><h1>Buscá tu próxima casa con<br><span>menos filtros y más conversación.</span></h1><p>Gallito entiende tu intención de búsqueda.</p></section>
  <form class="search" aria-label="Preparar consulta"><label for="query">Contale al Gallito qué estás buscando</label><div class="field"><input id="query" name="query" maxlength="500" placeholder="Una casa con jardín en Montevideo…" autocomplete="off" required><button type="submit" title="Buscar propiedades en Gallito">Buscar <span aria-hidden="true">↗</span></button></div><p class="search-status" role="status" aria-live="polite"></p></form>
</main>
<dialog class="operations" aria-labelledby="operation-title" aria-describedby="operation-help">
  <div class="operation-intro"><h2 id="operation-title">¿Qué estás buscando?</h2><p id="operation-help">Elegí el tipo de operación para continuar.</p></div>
  <div class="operation-options">
    <button type="button" data-operation="sale"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10 12 3l9 7v10H3Z M9 20v-8h6v8"/></svg><span><strong>Compra</strong><small>Comprar una propiedad</small></span></button>
    <button type="button" data-operation="rental"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="16" r="4"/><path d="m10 13 10-10m-4 4 3 3m-6 0 3 3"/></svg><span><strong>Alquiler</strong><small>Alquiler a largo plazo</small></span></button>
    <button type="button" data-operation="temporary_rental"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6m10-6v6M3 11h18"/></svg><span><strong>Temporal</strong><small>Alquiler de corta estadía</small></span></button>
  </div>
  <button type="button" class="operation-close" aria-label="Volver a editar la consulta">×</button>
</dialog>
<script src="script.js"></script>
</body></html>
