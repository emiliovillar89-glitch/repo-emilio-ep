<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Banner 300x600 | Penca Ovación Mundial 2026</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="ad-shell" aria-label="Publicidad interactiva de Penca Ovación Mundial 2026">
      <section class="banner" id="banner">
        <div class="stadium-glow" aria-hidden="true"></div>
        <div class="confetti" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>

        <header class="brand-bar">
          <div class="brand-mark" aria-hidden="true">⚽</div>
          <div>
            <p class="eyebrow">Mundial 2026</p>
            <h1>Penca Ovación</h1>
          </div>
        </header>

        <section class="hero" aria-live="polite">
          <p class="tag">No te quedes afuera</p>
          <h2>La penca más grande del Uruguay</h2>
          <p class="copy">Pronosticá, armá grupo con amigos y competí por la gloria.</p>
        </section>

        <section class="collectibles-card" aria-labelledby="collectiblesTitle">
          <div class="collectibles-head">
            <div>
              <p class="micro">Coleccionables</p>
              <h3 id="collectiblesTitle">Explorá la colección</h3>
            </div>
            <span class="collectibles-counter" id="collectiblesCounter" aria-live="polite">1/4</span>
          </div>

          <div class="carousel" aria-label="Carrusel de coleccionables">
            <div class="carousel-window">
              <div class="carousel-track" id="collectiblesTrack"></div>
            </div>

            <div class="carousel-controls">
              <button type="button" class="carousel-arrow" id="prevCollectible" aria-label="Ver coleccionable anterior">‹</button>
              <div class="carousel-dots" id="collectiblesDots" aria-label="Seleccionar coleccionable"></div>
              <button type="button" class="carousel-arrow" id="nextCollectible" aria-label="Ver coleccionable siguiente">›</button>
            </div>
          </div>
        </section>

        <a class="cta" href="https://penca.ovacion.futbolx.uy/" target="_blank" rel="noopener noreferrer" aria-label="Descargar la app de Penca Ovación">
          Descargar gratis
          <span>→</span>
        </a>

        <footer class="legal">Publicidad · Ovación · El País</footer>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
