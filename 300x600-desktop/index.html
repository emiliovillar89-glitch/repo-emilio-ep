<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://d1arj0auhm8wf3.cloudfront.net https://el-pais.brightspotcdn.com https://redirect.elpais.uy https://flagcdn.com; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Banner 300x600 Desktop | Penca Antel Ovación Mundial 2026</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="ad-shell" aria-label="Publicidad interactiva de Penca Antel Ovación Mundial 2026">
      <section class="banner" id="banner">
        <div class="stadium-glow" aria-hidden="true"></div>
        <div class="field-lines" aria-hidden="true"></div>
        <div class="stadium-static" aria-hidden="true">
          <div class="stadium-static__noise"></div>
          <div class="stadium-static__board stadium-static__board--top">
            <div class="stadium-static__track">
              <img src="https://el-pais.brightspotcdn.com/53/d5/85909f884a3e90ebe867a8035f56/r-logo-ovacion.svg" alt="" referrerpolicy="no-referrer" loading="lazy" decoding="async" />
              <img src="https://redirect.elpais.uy/logoteca/logos/antel-1.svg" alt="" referrerpolicy="no-referrer" loading="lazy" decoding="async" />
              <img src="https://el-pais.brightspotcdn.com/53/d5/85909f884a3e90ebe867a8035f56/r-logo-ovacion.svg" alt="" referrerpolicy="no-referrer" loading="lazy" decoding="async" />
              <img src="https://redirect.elpais.uy/logoteca/logos/antel-1.svg" alt="" referrerpolicy="no-referrer" loading="lazy" decoding="async" />
              <img src="https://el-pais.brightspotcdn.com/53/d5/85909f884a3e90ebe867a8035f56/r-logo-ovacion.svg" alt="" referrerpolicy="no-referrer" loading="lazy" decoding="async" />
              <img src="https://redirect.elpais.uy/logoteca/logos/antel-1.svg" alt="" referrerpolicy="no-referrer" loading="lazy" decoding="async" />
              <img src="https://el-pais.brightspotcdn.com/53/d5/85909f884a3e90ebe867a8035f56/r-logo-ovacion.svg" alt="" referrerpolicy="no-referrer" loading="lazy" decoding="async" />
              <img src="https://redirect.elpais.uy/logoteca/logos/antel-1.svg" alt="" referrerpolicy="no-referrer" loading="lazy" decoding="async" />
            </div>
          </div>
        </div>

        <header class="brand-bar">
          <div class="brand-mark" aria-hidden="true">
            <img
              class="brand-logo"
              src="https://d1arj0auhm8wf3.cloudfront.net/uploads/landing/logo.png"
              alt=""
              referrerpolicy="no-referrer"
              loading="eager"
              decoding="async"
            />
          </div>
          <div>
            <p class="eyebrow">Penca Mundial 2026</p>
            <h1>Antel Ovación</h1>
          </div>
        </header>

        <section class="quiz-card" id="quizCard">
          <div class="progress" aria-hidden="true">
            <span class="progress-dot is-active"></span>
            <span class="progress-dot"></span>
            <span class="progress-dot"></span>
          </div>

          <div class="question-panel is-active" id="questionPanel" data-step="0">
            <p class="micro" id="questionCounter">Pregunta 1 de 3</p>
            <h3 id="questionText">¿Quién llega más lejos?</h3>
            <div class="choices" id="choices" role="group" aria-label="Elegí una respuesta"></div>
          </div>

          <div class="result-panel" id="resultPanel" tabindex="-1">
            <p class="micro">¡Listo!</p>
            <h3>¿Listo para jugar el Mundial?</h3>
            <p id="summary">Armá tu penca en Ovación.</p>
            <a class="info-link" href="https://penca.ovacion.futbolx.uy/" target="_blank" rel="noopener noreferrer">Descargá la app</a>
          </div>
        </section>

        <section class="hero" aria-live="polite">
          <h2>La penca más grande del <span>Uruguay</span></h2>
        </section>

        <div class="store-buttons" aria-label="Descargar la app">
          <a class="store-button" href="https://penca.ovacion.futbolx.uy/" target="_blank" rel="noopener noreferrer">Descargá la app</a>
        </div>

        <footer class="brand-footer" aria-label="Marcas participantes">
          <img
            class="brand-footer__logo brand-footer__logo--ovacion"
            src="https://el-pais.brightspotcdn.com/53/d5/85909f884a3e90ebe867a8035f56/r-logo-ovacion.svg"
            alt="Ovación"
            referrerpolicy="no-referrer"
            loading="lazy"
            decoding="async"
          />
          <span aria-hidden="true"></span>
          <img
            class="brand-footer__logo brand-footer__logo--antel"
            src="https://redirect.elpais.uy/logoteca/logos/antel-1.svg"
            alt="Antel"
            referrerpolicy="no-referrer"
            loading="lazy"
            decoding="async"
          />
        </footer>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
